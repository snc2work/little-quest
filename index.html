<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Quest</title>
  </head>
  <body>
    <main>
      <h1>Little Quest</h1>
      <div id="controls">
        <label for="seed">Map No.</label>
        <input id="seed" type="number" min="0" step="1" />
        <button id="random" type="button" title="Pick a random map number">Random</button>
        <button id="restart" type="button" title="Start this map again">Restart</button>
      </div>
      <canvas id="screen" width="32" height="32" tabindex="0"></canvas>
      <dl id="info">
        <dt>Scene</dt>
        <dd id="scene">-</dd>
        <dt>Steps</dt>
        <dd id="steps">0</dd>
        <dt>Last event</dt>
        <dd id="event">-</dd>
      </dl>
      <div id="pad" aria-label="Controls">
        <button type="button" data-action="up" class="up" title="Up">&#9650;</button>
        <button type="button" data-action="left" class="left" title="Left">&#9664;</button>
        <button type="button" data-action="none" class="wait" title="Wait">Wait</button>
        <button type="button" data-action="right" class="right" title="Right">&#9654;</button>
        <button type="button" data-action="down" class="down" title="Down">&#9660;</button>
      </div>
      <p class="help">
        Move with the arrow keys, WASD or the buttons. Space waits.<br />
        To go inside, stand on the path right below the hut door and press Up.<br />
        To go back out, stand right above the room's exit and press Down.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
